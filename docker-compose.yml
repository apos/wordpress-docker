services:
  db:
    image: mariadb:10.11
    container_name: wp_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: QShana4$
      MYSQL_DATABASE: wp-qs-wiki
      MYSQL_USER: quanto
      MYSQL_PASSWORD: QShana4$
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:php8.2-fpm
    container_name: wp_app
    restart: unless-stopped
    depends_on:
      - db
    environment:
      WORDPRESS_CONFIG_EXTRA: |
        define('FS_METHOD', 'direct');
        define('WP_AUTO_UPDATE_CORE', true);
    volumes:
      - wp_data:/var/www/html
    expose:
      - "9000"

  nginx:
    image: nginx:latest
    container_name: wp_nginx
    restart: unless-stopped
    depends_on:
      - wordpress
    ports:
      - "8088:80"
    volumes:
      - wp_data:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  wpcli:
    image: wordpress:cli
    container_name: wp_cli
    depends_on:
      - wordpress
    volumes:
      - wp_data:/var/www/html
    user: "82:82"  # www-data im CLI-Image hat UID+GID 82
    entrypoint: ["tail", "-f", "/dev/null"]

volumes:
  db_data:
  wp_data:
